<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" fill="none">
  <!-- Editorial header · light (paper & ink & IKB) -->
  <rect width="1000" height="230" fill="#FAFAF6"/>
  <!-- corner registration marks -->
  <path d="M28 20v14M21 27h14" stroke="#C9C8BE" stroke-width="1.5"/>
  <path d="M972 20v14M965 27h14" stroke="#C9C8BE" stroke-width="1.5"/>
  <!-- top meta line -->
  <text x="28" y="58" font-family="Menlo,Consolas,monospace" font-size="11" letter-spacing="3" fill="#6E6D66">SURAT, IN — OPEN TO WORK</text>
  <text x="972" y="58" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="11" letter-spacing="3" fill="#6E6D66">EST. 2024</text>
  <!-- name with trailing italic period (tspan flows inline — no manual offset) -->
  <text x="28" y="132" font-family="Georgia,'Times New Roman',serif" font-size="58" fill="#101010">Pratham Patel<tspan font-style="italic" fill="#1D33D8">.</tspan></text>
  <!-- role line -->
  <text x="28" y="172" font-family="Menlo,Consolas,monospace" font-size="14" letter-spacing="2.5" fill="#1D33D8">AI-NATIVE FULL-STACK DEVELOPER</text>
  <!-- hairline -->
  <rect x="28" y="196" width="944" height="1" fill="#E7E6DF"/>
  <text x="28" y="218" font-family="Menlo,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#8B8A80">shipped with agents · reviewed by a human</text>
  <!-- P. mark, top right area -->
  <rect x="892" y="76" width="80" height="80" rx="18" fill="#1D33D8"/>
  <text x="932" y="128" text-anchor="middle" font-family="Georgia,serif" font-size="40" font-style="italic" fill="#FAFAF6">P.</text>
</svg>
