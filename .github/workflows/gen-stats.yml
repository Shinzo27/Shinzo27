name: Refresh branded stats card

on:
  push:
    branches: [main]
    paths:
      - "scripts/gen_stats.py"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday morning
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVGs (light + dark)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py

      - name: Commit refreshed cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "stats: refresh branded stat card"
          file_pattern: assets/stats-*.svg
