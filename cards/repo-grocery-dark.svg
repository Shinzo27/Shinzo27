<svg xmlns="http://www.w3.org/2000/svg" width="320" height="158" viewBox="0 0 320 158" role="img" aria-label="Grocery-Store">
<title>Grocery-Store</title>
<style>@font-face{font-family:'serif';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'mono';font-style:normal;font-weight:500;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}
text{transform-box:fill-box;}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes riseSm{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.82)}60%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes sweep{0%{transform:translateX(-260px)}55%,100%{transform:translateX(760px)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(22px) rotate(-3.5deg)}62%{opacity:1;transform:translateY(-4px) rotate(1.1deg)}86%{transform:translateY(1px) rotate(-.3deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.28;transform:scale(.72)}}
@keyframes ring{0%{opacity:.55;transform:scale(.35)}70%{opacity:0;transform:scale(1.5)}100%{opacity:0;transform:scale(1.5)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3.5px)}}
@keyframes count{from{transform:translateY(0)}to{transform:translateY(var(--roll))}}
@keyframes cellIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.rise{animation:rise .78s cubic-bezier(.22,.68,.32,1) both}
.riseSm{animation:riseSm .6s cubic-bezier(.22,.68,.32,1) both}
.fade{animation:fade .7s ease both}
.pop{animation:pop .68s cubic-bezier(.2,.8,.3,1) both;transform-origin:center}
.cell{transform-origin:center}
.grow{transform-origin:bottom;transform-box:fill-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs></defs>
<rect width="320" height="158" rx="8" fill="#0E0E0C"/>
<rect x="0.5" y="0.5" width="319" height="157" rx="8" fill="none" stroke="#232320"/>
<rect width="320" height="158" rx="10" fill="#151512"/>
<rect x="0.5" y="0.5" width="319" height="157" rx="10" fill="none" stroke="#232320"/>
<g class="riseSm" style="animation-delay:2.27s">
<text x="20.0" y="30.0" font-family="mono" font-size="8.5" fill="#8F8E83" letter-spacing="1.500">TYPESCRIPT</text>
<text x="96.5" y="30.0" font-family="mono" font-size="8.5" fill="#232320" letter-spacing="1.500">·</text>
<text x="102.5" y="30.0" font-family="mono" font-size="8.5" fill="#8F8E83" letter-spacing="1.500">2024</text>
<text x="20.0" y="68.0" font-family="serif" font-size="25" fill="#F2F1EA" letter-spacing="-0.300">Grocery-Store</text>
<text x="20.0" y="92.0" font-family="mono" font-size="9.5" fill="#8F8E83">MERN storefront with a Next admin,</text>
<text x="20.0" y="109.0" font-family="mono" font-size="9.5" fill="#8F8E83">Redis cache, Docker on EC2.</text>
<path d="M286 136 h10 m-4 -4 l4 4 l-4 4" fill="none" stroke="#8B9CFF" stroke-width="1.4" stroke-linecap="round"/>
</g>
</svg>
